<h2>Todo List</h2>

@if(todosList().length == 0){
    <p>No todos found!</p>
} @else {
    <p>Todos Loaded...</p>
}

<form>
    <label>Filter Todos: </label>
    <input name="filterTodos" type="text" placeholder="Search todos" [(ngModel)]="searchTerm">
</form>

<ul class="todos">
    @for(todo of todosList() | filterTodosPipe : searchTerm(); track todo.id) {
        <app-todo-item [todoItem]="todo" (todoCompleted)="updateTodo($event)"></app-todo-item>
    } @empty {
        <p>No todos found!</p>
    }
</ul>
